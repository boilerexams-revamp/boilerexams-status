owner: boilerexams-revamp
repo: boilerexams-status

sites:
  - name: Boilerexams
    url: https://boilerexams.com/
    # A Cloudflare or proxy error page still returns HTML, so check for the real page
    __dangerous__body_down_if_text_missing: "<title>Boilerexams"
  - name: Boilerexams API
    url: https://api.boilerexams.com/v3/
    # The API root reports database health; a 200 with the database down is still an outage
    __dangerous__body_down_if_text_missing: '"database_ok":true'
  - name: BoilerClasses
    url: https://boilerclasses.com/
    __dangerous__body_down_if_text_missing: "<title>BoilerClasses"
  - name: Staff sign-in
    url: https://login.boilerexams.com/-/health/live/

status-website:
  cname: status.boilerexams.com
  theme: light
  logoUrl: https://boilerexams.com/boilerexams-logo.png
  logoHref: https://boilerexams.com
  hideNavLogo: true
  favicon: https://boilerexams.com/favicon.ico
  links:
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap
  # Boilerexams font and colours on top of the light theme; status colours stay green/yellow/red
  css: >-
    :root { --body-background-color: #f0f0f0; --body-text-color: #343a40;
    --nav-border-bottom-color: #e4dccb; --card-border-color: #e4dccb; --nav-current-border-bottom-color: #cfb991; }
    body, button, input { font-family: Rubik, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  name: Boilerexams Status
  introTitle: "Boilerexams status"
  introMessage: Live uptime for Boilerexams and BoilerClasses, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: Boilerexams
      href: https://boilerexams.com
    - title: BoilerClasses
      href: https://boilerclasses.com
